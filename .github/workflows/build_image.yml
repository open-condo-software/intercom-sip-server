name: "[Build] Build image"

on:
  push:
    tags:
      - '*'

jobs:
  build-image:
    if: false
    name: "Build And Push Docker Image"
    runs-on: ubuntu-latest
    env:
      REGISTRY: ${{ secrets.DOCKER_REGISTRY }}/intercom-server
      IMAGE_NAME: sip-server
    steps:
      - name: Check tag
        id: 'check-tag'
        run: |
          if [[ ${{ github.event.ref }} =~ ^refs/tags/[0-9]+\.[0-9]+\.[0-9]+$ ]]
          then
              echo "match=true" >> $GITHUB_OUTPUT
              TAG_NAME="${GITHUB_REF#refs/tags/}"
              echo "TAG_NAME=$TAG_NAME" >> "$GITHUB_OUTPUT"
              exit 0
          else
              echo "Wrong tag name was provided. Tag should be created with pattern 'x.y.z' (1.0.0)"
              exit 1
          fi

      - name: Login to cloud registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.SBERCLOUD_CR_USERNAME }}
          password: ${{ secrets.SBERCLOUD_CR_PASSWORD }}

      - name: Checkout code
        id: buildx-context
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push sip-server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          provenance: false
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.check-tag.outputs.TAG_NAME }}
